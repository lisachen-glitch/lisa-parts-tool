<!DOCTYPE html>
<html>
<head>
    <title>Lisa Parts Tool</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; background: #f4f7f6; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 400px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        #result { margin-top: 20px; line-height: 1.6; font-size: 14px; }
        a { color: #007bff; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>電子零件規格查詢</h2>
        <input type="text" id="mpn" placeholder="輸入料號, 例如: LMR54406">
        <button onclick="search()">搜尋</button>
        <div id="result"></div>
    </div>

    <script>
        async function search() {
            const mpn = document.getElementById('mpn').value;
            const resDiv = document.getElementById('result');
            resDiv.innerText = "查詢中...";
            
            try {
                const response = await fetch('/api/search', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mpn })
                });
                const data = await response.json();
                resDiv.innerHTML = `<strong>規格摘要:</strong><br>${data.summary}<br><br>` + 
                                   (data.pdf ? `<a href="${data.pdf}" target="_blank">📄 下載 Datasheet</a>` : "❌ 無 PDF 資料");
            } catch (e) {
                resDiv.innerText = "連線失敗，請稍後再試";
            }
        }
    </script>
</body>
</html>
